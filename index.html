<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños ♥ Elige tu destino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#160a0e;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0709;--ink:#fff}}
:root[data-theme="dark"]{--bg:#0d0709;--ink:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
h1,h2,.big{font-family:Fraunces,Georgia,serif}
.screen{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.screen.on{opacity:1;visibility:visible}
svg{position:absolute;inset:0;width:100%;height:100%}
/* HOME */
#home{display:flex}
.half{position:relative;flex:1;overflow:hidden;cursor:pointer;transition:flex .8s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:0;color:#fff}
.half:hover,.half:focus-visible{flex:1.35;outline:none}
.half::after{content:"";position:absolute;inset:0;background:var(--t);mix-blend-mode:multiply;opacity:.55;transition:opacity .6s}
.half:hover::after{opacity:.25}
.half>*{position:relative;z-index:2;text-shadow:0 3px 24px rgba(0,0,0,.55)}
.half.p{--t:#d3202f}.half.a{--t:#1c54c9}
.big{font-size:clamp(2.6rem,8vw,6rem);font-weight:800;letter-spacing:-.02em}
.half small{font-size:1.05rem;opacity:.92}
.go{margin-top:14px;padding:9px 20px;border-radius:99px;border:1.5px solid #fff;font-weight:700;transition:background .4s,color .4s}
.half:hover .go{background:#fff;color:#111;text-shadow:none}
.seen{margin-top:10px;font-weight:700}
#ttl{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);background:rgba(15,8,10,.72);backdrop-filter:blur(8px);padding:10px 22px;border-radius:99px;font-weight:700;text-align:center;width:max-content;max-width:92vw;pointer-events:none}
@media (max-width:700px){#home{flex-direction:column}.big{font-size:clamp(2.4rem,13vw,4rem)}}
/* DESTINO */
#dest{--c:#e63946;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
#dest .bg{position:absolute;inset:0;filter:blur(3px) brightness(.6);transform:scale(1.06)}
.panel{position:relative;z-index:2;width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;background:rgba(14,8,10,.68);backdrop-filter:blur(14px);border-radius:26px;border-top:5px solid var(--c);padding:clamp(18px,3.5vw,34px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dots{display:flex;gap:8px}.dots i{width:34px;height:6px;border-radius:9px;background:rgba(255,255,255,.25);transition:background .5s}.dots i.on{background:var(--c)}
.city{font-family:Fraunces,serif;font-weight:800;font-size:1.3rem;color:var(--c);filter:brightness(1.35)}
#body{overflow:auto;padding:4px 2px;transition:opacity .35s,transform .35s}
#body.out{opacity:0;transform:translateY(14px)}
h2{font-size:clamp(1.5rem,4.4vw,2.4rem);line-height:1.12;margin:6px 0 16px}
ul{list-style:none;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
li{display:flex;gap:12px;padding:14px;background:rgba(255,255,255,.07);border-left:3px solid var(--c);border-radius:8px 16px 16px 8px}
li span{font-size:1.7rem}li b{display:block;margin-bottom:3px}li p{font-size:.93rem;line-height:1.45;opacity:.9}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pc{position:relative;height:200px;border-radius:16px;overflow:hidden}
.pc b{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:.9rem}
.pc::before{content:"";position:absolute;inset:0;z-index:2}
.fog::before{background:linear-gradient(rgba(235,235,240,.62),rgba(235,235,240,.05) 70%)}
.rain::before{background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(255,255,255,.28) 9px 10px);background-size:60px 60px;animation:rn 1.1s linear infinite}
.dusk::before{background:linear-gradient(rgba(255,150,40,.45),rgba(120,20,40,.4));mix-blend-mode:soft-light}
@keyframes rn{to{background-position:-20px 60px}}
.note{margin-top:12px;font-size:.92rem;opacity:.85}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
button.b{font:inherit;font-weight:700;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:11px 22px;cursor:pointer;transition:background .3s,transform .3s}
button.b:hover,button.b:focus-visible{background:rgba(255,255,255,.16);transform:translateY(-2px);outline:none}
button.b.main{background:var(--c);border-color:var(--c)}
button.b[hidden]{visibility:hidden;display:block}
/* FINAL */
#done{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#done .bg{position:absolute;inset:0;filter:brightness(.55)}
#done>*:not(.bg){position:relative;z-index:2;text-shadow:0 3px 24px rgba(0,0,0,.6)}
#done .big{font-size:clamp(2.4rem,9vw,5.5rem);line-height:1.05;margin-bottom:12px}
#done p{font-size:1.2rem;margin-bottom:22px}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>

<section id="home" class="screen on"><div id="ttl"></div></section>
<section id="dest" class="screen"><div class="bg"></div>
  <div class="panel">
    <div class="top"><span class="city"></span><div class="dots"><i></i><i></i><i></i></div></div>
    <div id="body"></div>
    <div class="nav"><button class="b" id="prev">← Atrás</button><button class="b main" id="next">Siguiente →</button></div>
  </div>
</section>
<section id="done" class="screen"><div class="bg"></div><h1 class="big"></h1><p>Feliz cumpleaños ♥ Este es mi regalo para ti.</p><button class="b main" id="again">Cambiar de opinión</button></section>

<script>
const $=s=>document.querySelector(s);
// Ilustraciones (sin imágenes externas: la página es autónoma)
function scene(k){
  let s='<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice">';
  if(k=='p'){
    s+='<defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b0710"/><stop offset=".6" stop-color="#c02a36"/><stop offset="1" stop-color="#ffa060"/></linearGradient><linearGradient id="wp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0704a"/><stop offset="1" stop-color="#4a0d18"/></linearGradient></defs><rect width="800" height="600" fill="url(#gp)"/><circle cx="560" cy="290" r="70" fill="#ffd9a0" opacity=".85"/><path d="M0 330 Q200 260 400 320 T800 290 V600H0Z" fill="#6b1420"/>';
    const c=['#e8b04a','#d9603b','#f2d9a6','#c2374a','#e58a5a'];
    const bank=(x0,n,b)=>{for(let i=0;i<n;i++){const x=x0+i*28,h=70+(i*41%110);s+=`<rect x="${x}" y="${b-h}" width="26" height="${h+10}" fill="${c[i%5]}"/><path d="M${x-2} ${b-h}l15-13 15 13z" fill="#7a2a1c"/><rect x="${x+8}" y="${b-h+18}" width="8" height="12" fill="#3a0d14"/>`}};
    bank(0,11,485);bank(500,11,485);
    s+='<rect y="480" width="800" height="120" fill="url(#wp)"/><g stroke="#ffd9a0" stroke-width="3" opacity=".5"><path d="M520 500h70M540 520h40M500 545h90"/></g>';
    let st='';for(let x=320;x<=480;x+=20){const t=(x-300)/200;st+=`M${x} 300V${480-720*t*(1-t)}`}
    s+=`<g stroke="#220509" stroke-width="5" fill="none"><path d="M240 300H570M300 480Q400 120 500 480"/><path stroke-width="3" d="${st}"/><path d="M250 478H560"/></g>`;
  }else{
    s+='<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2358"/><stop offset=".6" stop-color="#3a78d8"/><stop offset="1" stop-color="#b5d8f5"/></linearGradient></defs><rect width="800" height="600" fill="url(#ga)"/>';
    s+='<path d="M0 400L110 230 200 320 320 150 430 330 530 220 650 340 740 240 800 300V600H0Z" fill="#24468a"/><g fill="#eef6ff"><path d="M320 150l-32 55 22-10 12 16 14-16 22 10z"/><path d="M110 230l-24 42 18-8 10 12 12-12 16 8z"/><path d="M530 220l-26 46 18-8 9 12 12-12 16 8z"/></g>';
    s+='<rect y="440" width="800" height="160" fill="#14508f"/><g stroke="#cfe6ff" stroke-width="3" fill="none" opacity=".55"><path d="M380 470q20-10 40 0t40 0M520 510q20-10 40 0t40 0M300 545q20-10 40 0t40 0"/></g>';
    s+='<path d="M0 470Q140 400 300 470L360 600H0Z" fill="#1f7a57"/><path d="M0 520Q160 470 330 540V600H0Z" fill="#175c43"/><path d="M110 430h26l-4 -60h-18z" fill="#f4f1ea"/><path d="M107 370h32l-16-24z" fill="#c23a3a"/>';
  }
  return s+'</svg>';
}
const D={
p:{n:'Oporto',c:'#e63946',sub:'Portugal',s:[
 ['¿Por qué viajar aquí?',[
  ['🌉','Una ciudad de postal','Su centro histórico es Patrimonio de la Humanidad: casas de colores, puentes de hierro y el Duero en medio.'],
  ['🚶','Se vive a pie','Las cuestas cansan, pero todo queda cerca: callejear sin prisa es el plan.'],
  ['✈️','Casi a la vuelta de la esquina','Poco más de una hora de vuelo desde Madrid, así que aprovechamos el fin de semana.'],
  ['🍷','Buen comer y mejor beber','Vino de Oporto, francesinha y pastelería en cada esquina.']]],
 ['¿Qué te va a enamorar de este lugar?',[
  ['🌇','El atardecer en el Duero','Cruzar el puente Dom Luís I mientras la ciudad se pone dorada.'],
  ['🥧','Un pastel de nata calentito','Recién hecho, con canela, y mejor si es el segundo del día.'],
  ['📚','Azulejos y librerías','La estación de São Bento y sus paredes azules son puro arte.'],
  ['🍇','Cata en Vila Nova de Gaia','Bodegas con vistas a la Ribeira y una copa esperándonos.']]],
 ['Cómo se verá cuando vayamos',[
  ['fog','Niebla suave sobre el río, a primera hora'],
  ['rain','Lluvia fina y luces cálidas en la Ribeira'],
  ['dusk','Atardeceres tempranos en tonos naranja']],
  'En noviembre hace fresquito (10–16 ºC, aprox.), hay días de lluvia y nos tocan castañas asadas por San Martín. Ilustraciones de ejemplo.']]},
a:{n:'Asturias',c:'#3b82f6',sub:'Principado de Asturias',s:[
 ['¿Por qué viajar aquí?',[
  ['⛰️','Montaña y mar a un paso','Los Picos de Europa y la costa cantábrica están a menos de una hora entre sí.'],
  ['🌿','Naturaleza de verdad','Bosques, acantilados y playas casi vacías fuera de temporada.'],
  ['🧀','Comer como reyes','Fabada, cachopo, queso de Cabrales y sidra escanciada.'],
  ['🚗','Un roadtrip precioso','Unas 4–5 horas desde Madrid y un viaje lleno de paradas bonitas.']]],
 ['¿Qué te va a enamorar de este lugar?',[
  ['🏞️','Los Lagos de Covadonga','Entre nubes y montañas, con un silencio que se te queda dentro.'],
  ['⚓','Cudillero y Lastres','Pueblos colgados sobre el mar con casitas de colores.'],
  ['🌊','El mar bravo de los bufones','Con oleaje fuerte, el agua sale disparada por las rocas.'],
  ['🍎','Una sidra escanciada','Y sentarnos sin prisas con un buen plato delante.']]],
 ['Cómo se verá cuando vayamos',[
  ['fog','Nubes bajas y niebla sobre los Picos'],
  ['rain','Orbayu (lluvia fina) y verdes intensos'],
  ['dusk','Cielos anaranjados sobre el Cantábrico']],
  'En noviembre hace fresco (8–15 ºC, aprox.), hay hayedos color cobre, primeras nieves en las cumbres y un mar con carácter. Ilustraciones de ejemplo.']]}
};
const seen={},K={p:0,a:0};let cur,st=0,mode='explore';
const screens=['home','dest','done'];
const show=id=>screens.forEach(s=>$('#'+s).classList.toggle('on',s==id));
function buildHome(){
  $('#home').querySelectorAll('.half').forEach(e=>e.remove());
  ['p','a'].forEach(k=>{
    const d=D[k],h=document.createElement('button');h.className='half '+k;h.type='button';
    h.innerHTML=scene(k)+`<h1 class="big">${d.n.toUpperCase()}</h1><small>${d.sub}</small>`+(seen[k]?'<div class="seen">✓ Ya lo has visto</div>':'')+`<span class="go">${mode=='choose'?'Elijo '+d.n:seen[k]?'Verlo otra vez':'Descubrirlo'}</span>`;
    h.onclick=()=>mode=='choose'?finish(k):open(k);
    $('#home').appendChild(h);
  });
  $('#ttl').textContent=mode=='choose'?'Ya has visto las dos… ¿cuál eliges? 💖':seen.p||seen.a?'Ahora, la otra opción 👀':'Feliz cumpleaños ♥ Elige un destino';
}
function open(k){cur=k;st=0;const d=D[k];
  $('#dest').style.setProperty('--c',d.c);$('#dest .bg').innerHTML=scene(k);$('.city').textContent=d.n;
  render(true);show('dest');}
function render(first){
  const d=D[cur],s=d.s[st],b=$('#body');
  const paint=()=>{
    let h=`<h2>${s[0]}</h2>`;
    if(st<2)h+='<ul>'+s[1].map(i=>`<li><span>${i[0]}</span><div><b>${i[1]}</b><p>${i[2]}</p></div></li>`).join('')+'</ul>';
    else h+='<div class="cards">'+s[1].map(i=>`<div class="pc ${i[0]}">${scene(cur)}<b>${i[1]}</b></div>`).join('')+`</div><p class="note">${s[2]}</p>`;
    b.innerHTML=h;b.classList.remove('out');
    document.querySelectorAll('.dots i').forEach((e,i)=>e.classList.toggle('on',i<=st));
    $('#prev').hidden=st==0;
    $('#next').textContent=st<2?'Siguiente →':seen[cur=='p'?'a':'p']?'Elegir mi destino →':'Volver a la elección →';
  };
  if(first)paint();else{b.classList.add('out');setTimeout(paint,340)}
}
$('#next').onclick=()=>{if(st<2){st++;render()}else{seen[cur]=1;mode=seen.p&&seen.a?'choose':'explore';buildHome();show('home')}};
$('#prev').onclick=()=>{if(st>0){st--;render()}};
function finish(k){
  const d=D[k];$('#done .bg').innerHTML=scene(k);$('#done h1').textContent='¡Nos vamos a '+d.n+'!';show('done');
  for(let i=0;i<60;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},85%,62%);animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.2}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),7500)}
}
$('#again').onclick=()=>{buildHome();show('home')};
buildHome();
</script>
</body>
</html>
